<VirtualHost *:10000>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Logs a la salida estándar para verlos en el panel de Render.
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
